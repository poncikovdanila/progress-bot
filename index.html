<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Привычки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    padding: 0;
    font-family: 'Courier New', ui-monospace, monospace;
    color: #a8d8de;
    background: #030d11;
    overflow-x: hidden;
    position: relative;
    min-height: 100vh;
  }

  /* ---------- СЛОИ ПЕЩЕРЫ ---------- */

  /* дальний фон: силуэты пород */
  #far {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0.55;
    pointer-events: none;
  }

  /* свечение вглубь пещеры — пульсирует */
  #glow {
    position: fixed;
    left: 50%;
    top: 8%;
    width: 130vw;
    height: 60vh;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center,
      rgba(28, 190, 178, 0.30) 0%,
      rgba(16, 110, 120, 0.16) 35%,
      transparent 70%);
    z-index: 0;
    pointer-events: none;
    animation: breathe 7s ease-in-out infinite;
    transition: opacity 1.2s ease;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.75; transform: translateX(-50%) scale(1); }
    50%      { opacity: 1;    transform: translateX(-50%) scale(1.07); }
  }

  /* виньетка — темнота по краям */
  #vignette {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background: radial-gradient(ellipse 90% 70% at 50% 35%,
      transparent 30%, rgba(2, 8, 11, 0.75) 100%);
  }

  /* частицы */
  #particles {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    overflow: hidden;
  }

  .mote {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #4ff2e4;
    box-shadow: 0 0 6px #2de0cf, 0 0 12px rgba(45, 224, 207, 0.6);
    animation: drift linear infinite;
  }

  @keyframes drift {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    10%  { opacity: 0.9; }
    90%  { opacity: 0.7; }
    100% { transform: translateY(-110vh) translateX(var(--dx, 20px)); opacity: 0; }
  }

  /* капли со сталактитов */
  .drop {
    position: absolute;
    width: 3px;
    height: 8px;
    background: linear-gradient(#4ff2e4, transparent);
    animation: fall linear infinite;
  }

  @keyframes fall {
    0%   { transform: translateY(0); opacity: 0; }
    5%   { opacity: 1; }
    100% { transform: translateY(70vh); opacity: 0; }
  }

  /* ---------- КОНТЕНТ ---------- */

  #content {
    position: relative;
    z-index: 4;
    padding: 90px 14px 40px;
  }

  h1 {
    font-size: 15px;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin: 0 0 4px;
    color: #6ffff0;
    text-shadow: 0 0 14px rgba(79, 242, 228, 0.7), 0 0 30px rgba(45, 224, 207, 0.3);
  }

  .sub {
    font-size: 10px;
    letter-spacing: 2px;
    color: #3d6a72;
    margin-bottom: 22px;
    text-transform: uppercase;
  }

  /* карточка = блок породы */
  .habit {
    position: relative;
    background:
      linear-gradient(180deg, rgba(12, 40, 48, 0.92) 0%, rgba(6, 24, 30, 0.92) 100%);
    border: 1px solid #17454f;
    border-top-color: #21606d;
    padding: 15px 14px;
    margin-bottom: 13px;
    overflow: hidden;
  }

  /* текстура «пикселей» на породе */
  .habit::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px);
    background-size: 8px 8px;
    pointer-events: none;
  }

  .habit.done {
    border-color: #2de0cf;
    box-shadow:
      0 0 22px rgba(45, 224, 207, 0.22),
      inset 0 0 30px rgba(45, 224, 207, 0.07);
  }

  /* волна-импульс при отметке */
  .habit.pulse::after {
    content: '';
    position: absolute;
    left: 50%; top: 50%;
    width: 10px; height: 10px;
    border: 2px solid #6ffff0;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    animation: ripple 0.7s ease-out forwards;
    pointer-events: none;
  }

  @keyframes ripple {
    0%   { width: 10px; height: 10px; opacity: 0.9; }
    100% { width: 420px; height: 420px; opacity: 0; }
  }

  .habit-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 11px;
    position: relative;
  }

  .habit-title {
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #9dc9d1;
  }

  .habit.done .habit-title {
    color: #6ffff0;
    text-shadow: 0 0 12px rgba(79, 242, 228, 0.6);
  }

  .habit-count {
    font-size: 11px;
    color: #3d6a72;
    white-space: nowrap;
  }

  /* прогресс = светящиеся жилы в породе */
  .bar {
    display: flex;
    gap: 4px;
    margin-bottom: 13px;
    position: relative;
  }

  .cell {
    flex: 1;
    height: 16px;
    background: #0a222a;
    border: 1px solid #143a44;
    position: relative;
  }

  .cell.filled {
    background: linear-gradient(180deg, #6ffff0 0%, #2de0cf 100%);
    border-color: #8ffff5;
    box-shadow: 0 0 10px rgba(45, 224, 207, 0.8), 0 0 20px rgba(45, 224, 207, 0.35);
    animation: vein 3s ease-in-out infinite;
  }

  .cell.filled:nth-child(2n) { animation-delay: 0.4s; }
  .cell.filled:nth-child(3n) { animation-delay: 0.8s; }

  @keyframes vein {
    0%, 100% { filter: brightness(1); }
    50%      { filter: brightness(1.25); }
  }

  button.act {
    width: 100%;
    padding: 12px;
    border: 1px solid #2de0cf;
    background: rgba(45, 224, 207, 0.05);
    color: #6ffff0;
    font-family: inherit;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    position: relative;
    transition: background 0.15s, box-shadow 0.15s;
  }

  button.act:active {
    background: rgba(45, 224, 207, 0.2);
    box-shadow: 0 0 26px rgba(45, 224, 207, 0.5);
  }

  button.act.undo {
    border-color: #24545e;
    color: #4d7f89;
    background: transparent;
  }

  #status, #error {
    text-align: center;
    padding: 28px 0;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #34606a;
  }

  #error { color: #d9615c; display: none; }
</style>
</head>
<body>

<!-- дальние породы + сталактиты -->
<svg id="far" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d323c"/>
      <stop offset="100%" stop-color="#061a21"/>
    </linearGradient>
    <linearGradient id="rockFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a2530"/>
      <stop offset="100%" stop-color="#04141a"/>
    </linearGradient>
  </defs>

  <!-- дальние колонны на горизонте -->
  <g fill="url(#rockFar)">
    <rect x="30" y="330" width="26" height="180"/>
    <rect x="38" y="300" width="12" height="40"/>
    <rect x="120" y="350" width="34" height="160"/>
    <rect x="128" y="320" width="16" height="40"/>
    <rect x="250" y="340" width="30" height="170"/>
    <rect x="300" y="360" width="40" height="150"/>
    <rect x="310" y="330" width="18" height="40"/>
  </g>

  <!-- сталактиты сверху (блочные ступени) -->
  <g fill="url(#rock)">
    <rect x="0" y="0" width="400" height="34"/>
    <!-- 1 -->
    <rect x="18" y="34" width="30" height="26"/>
    <rect x="24" y="60" width="18" height="24"/>
    <rect x="29" y="84" width="8" height="20"/>
    <!-- 2 -->
    <rect x="86" y="34" width="22" height="18"/>
    <rect x="91" y="52" width="12" height="16"/>
    <!-- 3 -->
    <rect x="150" y="34" width="36" height="34"/>
    <rect x="158" y="68" width="20" height="28"/>
    <rect x="164" y="96" width="10" height="26"/>
    <rect x="167" y="122" width="4" height="16"/>
    <!-- 4 -->
    <rect x="228" y="34" width="24" height="22"/>
    <rect x="234" y="56" width="12" height="18"/>
    <!-- 5 -->
    <rect x="290" y="34" width="34" height="30"/>
    <rect x="298" y="64" width="18" height="26"/>
    <rect x="303" y="90" width="8" height="18"/>
    <!-- 6 -->
    <rect x="356" y="34" width="28" height="20"/>
    <rect x="363" y="54" width="14" height="22"/>
    <rect x="367" y="76" width="6" height="14"/>
  </g>

  <!-- светящиеся вкрапления в породе -->
  <g fill="#2de0cf" opacity="0.75">
    <rect x="31" y="72" width="4" height="4"/>
    <rect x="165" y="88" width="4" height="4"/>
    <rect x="170" y="110" width="3" height="3"/>
    <rect x="301" y="78" width="4" height="4"/>
    <rect x="95" y="46" width="3" height="3"/>
    <rect x="238" y="62" width="3" height="3"/>
  </g>

  <!-- пол пещеры -->
  <g fill="url(#rock)">
    <rect x="0" y="700" width="400" height="100"/>
    <rect x="40" y="676" width="40" height="24"/>
    <rect x="150" y="684" width="60" height="16"/>
    <rect x="280" y="672" width="46" height="28"/>
  </g>
  <g fill="#2de0cf" opacity="0.6">
    <rect x="52" y="686" width="5" height="5"/>
    <rect x="176" y="690" width="4" height="4"/>
    <rect x="296" y="682" width="5" height="5"/>
    <rect x="120" y="712" width="4" height="4"/>
    <rect x="340" y="720" width="4" height="4"/>
  </g>
</svg>

<div id="glow"></div>
<div id="particles"></div>
<div id="vignette"></div>

<div id="content">
  <h1>Привычки</h1>
  <div class="sub">неделя в процессе</div>
  <div id="status">загрузка…</div>
  <div id="error"></div>
  <div id="habits"></div>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const habitsEl = document.getElementById('habits');
  const statusEl = document.getElementById('status');
  const errorEl = document.getElementById('error');
  const glowEl = document.getElementById('glow');

  /* ---------- атмосфера ---------- */

  function spawnParticles() {
    const box = document.getElementById('particles');
    for (let i = 0; i < 26; i++) {
      const m = document.createElement('div');
      m.className = 'mote';
      m.style.left = Math.random() * 100 + 'vw';
      m.style.top = (100 + Math.random() * 30) + 'vh';
      m.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');
      m.style.animationDuration = (14 + Math.random() * 16) + 's';
      m.style.animationDelay = (-Math.random() * 20) + 's';
      m.style.opacity = 0.3 + Math.random() * 0.6;
      box.appendChild(m);
    }
    // капли со сталактитов
    [8, 40, 72].forEach((leftPct, i) => {
      const d = document.createElement('div');
      d.className = 'drop';
      d.style.left = leftPct + 'vw';
      d.style.top = '5vh';
      d.style.animationDuration = (2.5 + i) + 's';
      d.style.animationDelay = (i * 1.7) + 's';
      box.appendChild(d);
    });
  }
  spawnParticles();

  // пещера светлеет по мере выполнения недельной цели
  function setCaveLight(habits) {
    if (!habits.length) return;
    const total = habits.reduce((s, h) => s + h.weekly_target, 0);
    const done = habits.reduce((s, h) => s + Math.min(h.done, h.weekly_target), 0);
    const ratio = total ? done / total : 0;
    glowEl.style.opacity = 0.35 + ratio * 0.9;
  }

  /* ---------- логика ---------- */

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
  }

  function cells(done, target) {
    let html = '<div class="bar">';
    for (let i = 0; i < target; i++) {
      html += `<div class="cell${i < done ? ' filled' : ''}"></div>`;
    }
    return html + '</div>';
  }

  function render(habits, pulseId) {
    statusEl.style.display = 'none';
    errorEl.style.display = 'none';
    habitsEl.innerHTML = '';

    if (!habits.length) {
      habitsEl.innerHTML = '<div id="status">привычек нет — добавь через /addhabit</div>';
      return;
    }

    habits.forEach(h => {
      const div = document.createElement('div');
      div.className = 'habit' + (h.logged_today ? ' done' : '') + (h.id === pulseId ? ' pulse' : '');
      div.innerHTML = `
        <div class="habit-top">
          <span class="habit-title">${h.title}</span>
          <span class="habit-count">${h.done} / ${h.weekly_target}</span>
        </div>
        ${cells(h.done, h.weekly_target)}
        <button class="act${h.logged_today ? ' undo' : ''}"
                data-id="${h.id}" data-action="${h.logged_today ? 'unlog' : 'log'}">
          ${h.logged_today ? '↩ отменить' : '▸ отметить'}
        </button>
      `;
      habitsEl.appendChild(div);
    });

    habitsEl.querySelectorAll('.act').forEach(btn => {
      btn.addEventListener('click', () => send(btn.dataset.action, btn.dataset.id));
    });

    setCaveLight(habits);
  }

  async function apiCall(path, options = {}) {
    const res = await fetch(path, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        'X-Telegram-Init-Data': tg.initData,
        ...(options.headers || {}),
      },
    });
    if (!res.ok) throw new Error(`сервер ответил ${res.status}`);
    return res.json();
  }

  async function load() {
    try {
      render((await apiCall('/api/habits')).habits);
    } catch (e) {
      statusEl.style.display = 'none';
      showError('не загрузилось: ' + e.message);
    }
  }

  async function send(action, habitId) {
    tg.HapticFeedback.impactOccurred(action === 'log' ? 'medium' : 'light');
    try {
      const data = await apiCall(`/api/${action}`, {
        method: 'POST',
        body: JSON.stringify({ habit_id: habitId }),
      });
      render(data.habits, action === 'log' ? habitId : null);
    } catch (e) {
      showError('не сохранилось: ' + e.message);
    }
  }

  load();
</script>
</body>
</html>
