<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Привычки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 18px 14px 32px;
    font-family: 'Courier New', ui-monospace, monospace;
    background:
      radial-gradient(ellipse 120% 60% at 50% -10%, #0d3d47 0%, transparent 60%),
      #05161c;
    color: #cfeef2;
    min-height: 100vh;
  }

  h1 {
    font-size: 15px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin: 0 0 4px;
    color: #4ff2e4;
    text-shadow: 0 0 12px rgba(79, 242, 228, 0.6);
  }

  .sub {
    font-size: 11px;
    letter-spacing: 1px;
    color: #4b7d86;
    margin-bottom: 20px;
    text-transform: uppercase;
  }

  .habit {
    position: relative;
    background: linear-gradient(180deg, #0a2831 0%, #071e26 100%);
    border: 1px solid #17454f;
    padding: 14px;
    margin-bottom: 12px;
    /* без скруглений — блочность */
  }

  .habit.done {
    border-color: #2de0cf;
    box-shadow: 0 0 18px rgba(45, 224, 207, 0.18), inset 0 0 24px rgba(45, 224, 207, 0.06);
  }

  .habit-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 10px;
  }

  .habit-title {
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #b8e8ee;
  }

  .habit.done .habit-title {
    color: #4ff2e4;
    text-shadow: 0 0 10px rgba(79, 242, 228, 0.5);
  }

  .habit-count {
    font-size: 12px;
    color: #4b7d86;
    white-space: nowrap;
  }

  /* блочный прогресс-бар: отдельные ячейки, а не плавная полоса */
  .bar {
    display: flex;
    gap: 3px;
    margin-bottom: 12px;
  }

  .cell {
    flex: 1;
    height: 14px;
    background: #0c2a33;
    border: 1px solid #16404a;
  }

  .cell.filled {
    background: #2de0cf;
    border-color: #6ffff0;
    box-shadow: 0 0 8px rgba(45, 224, 207, 0.7);
  }

  button.act {
    width: 100%;
    padding: 11px;
    border: 1px solid #2de0cf;
    background: transparent;
    color: #4ff2e4;
    font-family: inherit;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s, box-shadow 0.15s;
  }

  button.act:active {
    background: rgba(45, 224, 207, 0.15);
    box-shadow: 0 0 20px rgba(45, 224, 207, 0.4);
  }

  button.act.undo {
    border-color: #2a5c66;
    color: #5f939d;
  }

  #status, #error {
    text-align: center;
    padding: 26px 0;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #3f6d76;
  }

  #error { color: #e0645f; display: none; }
</style>
</head>
<body>
  <h1>Привычки</h1>
  <div class="sub">неделя в процессе</div>
  <div id="status">загрузка…</div>
  <div id="error"></div>
  <div id="habits"></div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const habitsEl = document.getElementById('habits');
  const statusEl = document.getElementById('status');
  const errorEl = document.getElementById('error');

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
  }

  function cells(done, target) {
    let html = '<div class="bar">';
    for (let i = 0; i < target; i++) {
      html += `<div class="cell${i < done ? ' filled' : ''}"></div>`;
    }
    return html + '</div>';
  }

  function render(habits) {
    statusEl.style.display = 'none';
    errorEl.style.display = 'none';
    habitsEl.innerHTML = '';
    if (!habits.length) {
      habitsEl.innerHTML = '<div id="status">привычек нет — добавь через /addhabit</div>';
      return;
    }
    habits.forEach(h => {
      const div = document.createElement('div');
      div.className = 'habit' + (h.logged_today ? ' done' : '');
      div.innerHTML = `
        <div class="habit-top">
          <span class="habit-title">${h.title}</span>
          <span class="habit-count">${h.done} / ${h.weekly_target}</span>
        </div>
        ${cells(h.done, h.weekly_target)}
        <button class="act${h.logged_today ? ' undo' : ''}"
                data-id="${h.id}" data-action="${h.logged_today ? 'unlog' : 'log'}">
          ${h.logged_today ? '↩ отменить' : '▸ отметить'}
        </button>
      `;
      habitsEl.appendChild(div);
    });
    habitsEl.querySelectorAll('.act').forEach(btn => {
      btn.addEventListener('click', () => send(btn.dataset.action, btn.dataset.id));
    });
  }

  async function apiCall(path, options = {}) {
    const res = await fetch(path, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        'X-Telegram-Init-Data': tg.initData,
        ...(options.headers || {}),
      },
    });
    if (!res.ok) throw new Error(`сервер ответил ${res.status}`);
    return res.json();
  }

  async function load() {
    try {
      render((await apiCall('/api/habits')).habits);
    } catch (e) {
      statusEl.style.display = 'none';
      showError('не загрузилось: ' + e.message);
    }
  }

  async function send(action, habitId) {
    tg.HapticFeedback.impactOccurred(action === 'log' ? 'medium' : 'light');
    try {
      const data = await apiCall(`/api/${action}`, {
        method: 'POST',
        body: JSON.stringify({ habit_id: habitId }),
      });
      render(data.habits);
    } catch (e) {
      showError('не сохранилось: ' + e.message);
    }
  }

  load();
</script>
</body>
</html>
